name: Marketing quality gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Virex / Astro / Product QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://www.markchat.co.ke
      PUBLIC_CONTROL_PLANE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply project Prettier to approved Marketing changes
        run: |
          npx prettier --write src/components/enterprise \
            src/pages/about.astro src/pages/index.astro src/pages/pricing.astro \
            src/pages/product src/pages/features.astro src/pages/features \
            src/pages/solutions src/pages/integrations.astro src/pages/integrations \
            src/pages/docs/index.astro src/pages/markcopilot.astro \
            tests/about-page.test.mjs tests/features-page.test.mjs \
            tests/homepage-experience.test.mjs tests/integrations-page.test.mjs
          git diff --check
      - name: Commit formatting to main if necessary
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/enterprise src/pages tests/about-page.test.mjs \
              tests/features-page.test.mjs tests/homepage-experience.test.mjs \
              tests/integrations-page.test.mjs
            git commit -m "style(marketing): apply Virex Prettier formatting [skip ci]"
            git push origin HEAD:main
          fi
      - name: Lint, format and Astro diagnostics
        run: npm run check
      - name: Generate static site
        run: npm run build
      - name: Run built-output and source tests
        run: npm test
